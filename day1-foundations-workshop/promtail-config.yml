server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: inventory-service-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: inventory-service
          __path__: /logs/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger_name
            message: message
            application: application
      - labels:
          level:
          application:
      - timestamp:
          source: timestamp
          format: RFC3339
